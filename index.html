<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وتيره | فحص أدلة الامتثال</title>
<meta name="theme-color" content="#0a2a4d">
<meta name="description" content="وتيره: منصة لفحص أدلة الامتثال وقياس الجاهزية قبل التقديم.">
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<style>
@font-face{font-family:"Plex Ar";src:url(fonts/plex-ar-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:"Plex Ar";src:url(fonts/plex-ar-500.woff2) format("woff2");font-weight:500;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:"Plex Ar";src:url(fonts/plex-ar-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:"Plex Ar";src:url(fonts/plex-ar-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}

@font-face{font-family:"Plex Ar";src:url(fonts/plex-la-500.woff2) format("woff2");font-weight:500;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"Plex Ar";src:url(fonts/plex-la-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"Plex Ar";src:url(fonts/plex-la-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"Readex";src:url(fonts/readex-ar-500.woff2) format("woff2");font-weight:500;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex";src:url(fonts/readex-ar-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex";src:url(fonts/readex-ar-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex";src:url(fonts/readex-la-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Readex";src:url(fonts/readex-la-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}

:root{
  --bg:#f4f7f9;--surface:#fff;--sunk:#eef3f6;--line:#dbe3ea;--line-2:#e8eef2;
  --ink:#0d2136;--ink-2:#3d5166;--ink-3:#6b7c8f;
  --brand:#087f7b;--brand-2:#0a948f;--brand-ink:#fff;--brand-soft:#e0f4f2;--brand-line:#b3e2de;
  --navy:#0a2a4d;--rail:#0a2a4d;--rail-2:#08223f;--rail-ink:#e6eef6;--rail-mute:#93a9c0;--accent:#2fd0c8;
  --ok:#1b7a4c;--ok-bg:#e1f3e8;--part:#9a5c05;--part-bg:#fcefd6;--bad:#b23a2f;--bad-bg:#f9e2df;--none:#73847f;--none-bg:#edf1f0;
  --rev:#5a43a6;--rev-bg:#ece7f9;
  --shadow:0 1px 2px rgba(15,36,33,.05),0 8px 24px -14px rgba(15,36,33,.22);
  --r:16px;--r-sm:10px;
  --f:"Plex Ar","IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --fd:"Readex","Plex Ar",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#08131f;--surface:#0f1d2c;--sunk:#0b1825;--line:#1f3247;--line-2:#182a3c;
  --ink:#e6eef6;--ink-2:#a9bccd;--ink-3:#7c90a5;
  --brand:#2fd0c8;--brand-2:#5be0d9;--brand-ink:#04201f;--brand-soft:#0f3537;--brand-line:#1d5254;
  --rail:#071a2e;--rail-2:#051424;
  --ok:#5fd095;--ok-bg:#15352a;--part:#eab25a;--part-bg:#3a2b12;--bad:#f0857a;--bad-bg:#3d1d1a;--none:#8ea29d;--none-bg:#1a2926;
  --rev:#b8a3f2;--rev-bg:#271f3f;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#08131f;--surface:#0f1d2c;--sunk:#0b1825;--line:#1f3247;--line-2:#182a3c;
  --ink:#e6eef6;--ink-2:#a9bccd;--ink-3:#7c90a5;
  --brand:#2fd0c8;--brand-2:#5be0d9;--brand-ink:#04201f;--brand-soft:#0f3537;--brand-line:#1d5254;
  --rail:#071a2e;--rail-2:#051424;
  --ok:#5fd095;--ok-bg:#15352a;--part:#eab25a;--part-bg:#3a2b12;--bad:#f0857a;--bad-bg:#3d1d1a;--none:#8ea29d;--none-bg:#1a2926;
  --rev:#b8a3f2;--rev-bg:#271f3f;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums;font-family:var(--fd)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--surface);padding:8px 14px;border-radius:8px;z-index:99}
.skip:focus{top:12px}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}

/* ---------- الهيكل ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 26px}
.brand .mark{width:58px;height:auto;display:block}
.mb-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .mb-light{display:none}:root:not([data-theme=light]) .mb-dark{display:block}}
:root[data-theme=dark] .mb-light{display:none}:root[data-theme=dark] .mb-dark{display:block}
.logo{width:46px;height:46px;border-radius:13px;background:var(--accent);display:grid;place-items:center;color:var(--rail)}
.logo svg{width:26px;height:26px;stroke:var(--rail);stroke-width:2.6}
.brand b{font-family:var(--fd);font-size:24px;font-weight:700;display:block;line-height:1.1}
.brand small{color:var(--rail-mute);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--rail-ink);text-decoration:none;font-weight:500;position:relative;opacity:.86}
.nav a:hover{background:rgba(255,255,255,.05);opacity:1}
.nav a[aria-current=page]{background:rgba(255,255,255,.08);opacity:1;font-weight:600}
.nav a[aria-current=page]::after{content:"";position:absolute;inset-inline-end:-16px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.nav .badge{margin-inline-start:auto;background:var(--accent);color:var(--rail);border-radius:20px;font-size:11px;padding:0 8px;font-weight:700}
.rail-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:16px}
.org{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;text-decoration:none;color:inherit}
.org:hover{background:rgba(255,255,255,.05)}
.org .ic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.07);display:grid;place-items:center}
.org b{font-size:14px;display:block}.org small{color:var(--rail-mute);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:14px}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs svg{width:14px;height:14px;transform:scaleX(-1)}
.top-actions{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:30px;padding:4px 12px;font-size:12.5px;font-weight:600;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--sunk)}
.content{padding:28px 40px 56px;max-width:1240px;width:100%;margin:0 auto}
.foot-note{color:var(--ink-3);font-size:12.5px;margin-top:22px}

/* ---------- عناصر عامة ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn.soft{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 6px}
.card-h .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.card-h h2{font-family:var(--fd);font-size:19px;margin:0;font-weight:600;line-height:1.35}
.card-h p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.card-h .end{margin-inline-start:auto}
.card-b{padding:16px 22px 22px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1fr 1fr}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:2px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-full{background:var(--ok-bg);color:var(--ok)}
.s-partial{background:var(--part-bg);color:var(--part)}
.s-missing{background:var(--bad-bg);color:var(--bad)}
.s-unchecked{background:var(--none-bg);color:var(--none)}
.s-rev{background:var(--rev-bg);color:var(--rev)}
.code{font-family:var(--fd);font-weight:600;font-size:12.5px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px 8px;direction:ltr;display:inline-block}
.muted{color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;color:var(--ink-2);font-weight:500}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{min-height:90px;resize:vertical;line-height:1.6}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3)}
.empty svg{width:34px;height:34px;opacity:.6;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.hr{height:1px;background:var(--line-2);margin:14px 0}

/* ---------- البطل ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(120deg,#0a2a4d,#0c3a5f 55%,#0a6b70);color:#eaf3f9;padding:34px 36px;display:flex;align-items:center;gap:24px;box-shadow:0 18px 40px -24px rgba(10,42,77,.75)}
.hero::before{content:"";position:absolute;inset-inline-end:-80px;top:-120px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,255,255,.1)}
.hero::after{content:"";position:absolute;inset-inline-end:240px;top:-40px;width:90px;height:340px;background:rgba(255,255,255,.06);transform:rotate(24deg);border-radius:40px}
.hero .eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;color:#9fe3de;font-weight:500}
.hero h1{font-family:var(--fd);font-size:38px;line-height:1.25;margin:6px 0 8px;font-weight:700;letter-spacing:-.2px}
.hero p{margin:0;color:#cfe0ec;max-width:620px}
.hero .grow{flex:1;position:relative;z-index:1}
.hero .btn{position:relative;z-index:1;background:#f2fbfa;color:#0a2a4d;border-color:transparent}
.hero .btn:hover{background:#fff}
.hero-stats{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-family:var(--fd);font-size:22px;color:#fff}
.hero-stats span{font-size:12.5px;color:#9fe3de}

/* ---------- المحددات ---------- */
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.picker{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px 10px;box-shadow:var(--shadow)}
.picker label{font-size:12.5px;color:var(--ink-3)}
.picker select{appearance:none;-webkit-appearance:none;border:0;background:transparent;width:100%;font-family:var(--fd);font-size:18px;font-weight:600;padding:2px 0 4px 28px;cursor:pointer;outline:none;color:var(--ink)}
.picker svg{position:absolute;left:16px;bottom:16px;width:18px;height:18px;pointer-events:none;color:var(--ink-3)}
.req-meta{display:flex;align-items:center;gap:10px;margin:14px 2px 18px;color:var(--ink-2);font-size:13.5px;flex-wrap:wrap}

/* ---------- الرفع ---------- */
.drop{border:1.5px dashed var(--brand-line);background:color-mix(in srgb,var(--brand-soft) 45%,transparent);border-radius:14px;padding:26px 18px;text-align:center;transition:background .15s,border-color .15s}
.drop.over{background:var(--brand-soft);border-color:var(--brand)}
.drop svg.big{width:26px;height:26px;color:var(--brand);margin-bottom:6px}
.drop b{display:block;font-size:16px}
.drop small{color:var(--ink-3);display:block;margin:2px 0 14px}
.files{display:flex;flex-direction:column;margin-top:14px}
.file{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line-2)}
.file .fi{width:38px;height:38px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--brand);flex:none}
.file .meta{min-width:0;flex:1}
.file .meta b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .meta small{color:var(--ink-3);font-size:12px}
.file.err .fi{color:var(--bad);background:var(--bad-bg)}
.file.err small{color:var(--bad)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--brand-line);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.stale{display:flex;gap:8px;align-items:center;background:var(--part-bg);color:var(--part);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:12px}

/* ---------- النتيجة ---------- */
.summary{display:flex;align-items:center;gap:18px;background:var(--sunk);border:1px solid var(--line-2);border-radius:14px;padding:14px 18px;margin-bottom:6px}
.ring{--p:0;--c:var(--brand);width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:62px;height:62px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:17px}
.summary b{font-size:16px;display:block}
.summary small{color:var(--ink-3)}
.conds{display:flex;flex-direction:column}
.cond{border-bottom:1px solid var(--line-2)}
.cond:last-child{border-bottom:0}
.cond-h{display:flex;align-items:center;gap:12px;padding:14px 2px;cursor:pointer;width:100%;background:none;border:0;text-align:start}
.cond-h .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.cond-h .st svg{width:14px;height:14px;stroke-width:2.6}
.cond-h .t{flex:1;font-weight:600;font-size:14.5px}
.cond-h .chev{width:18px;height:18px;color:var(--ink-3);transition:transform .2s}
.cond.open .chev{transform:rotate(180deg)}
.cond-b{display:none;padding:0 36px 16px 2px}
.cond.open .cond-b{display:block}
.reason{color:var(--ink-2);font-size:13.5px;margin:0 0 10px}
.quote{border-inline-start:3px solid var(--brand-line);background:var(--sunk);border-radius:10px;padding:10px 14px;margin:0 0 10px;font-size:13.5px}
.quote .src{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;margin-bottom:4px;color:var(--ink)}
.quote p{margin:2px 0;color:var(--ink-2)}
mark{background:color-mix(in srgb,var(--ok) 22%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.hint{display:flex;gap:8px;font-size:13px;color:var(--ink-2);background:color-mix(in srgb,var(--part-bg) 60%,transparent);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.hint svg{color:var(--part);margin-top:3px;width:16px;height:16px}
.missing-terms{font-size:12.5px;color:var(--ink-3);margin:-4px 0 10px}
.rev-box{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rev-note{font-size:12.5px;color:var(--rev);background:var(--rev-bg);border-radius:8px;padding:6px 10px;margin-bottom:10px}
.priority{display:flex;gap:12px;background:var(--part-bg);border-radius:14px;padding:14px 16px;margin-top:14px;color:var(--ink)}
.priority svg{color:var(--part)}
.priority b{display:block;font-size:14px;color:var(--part)}
.priority p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.priority.ok{background:var(--ok-bg)}.priority.ok svg,.priority.ok b{color:var(--ok)}
.plan-inline{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-top:8px}

/* ---------- الشريط السفلي ---------- */
.forecast-strip{display:flex;align-items:center;gap:26px;padding:18px 22px;margin-top:20px;flex-wrap:wrap}
.forecast-strip .ttl{display:flex;gap:12px;align-items:center;flex:1.3;min-width:200px}
.forecast-strip .ttl .ic{width:42px;height:42px;border-radius:12px;background:var(--rev-bg);color:var(--rev);display:grid;place-items:center}
.forecast-strip h3{margin:0;font-family:var(--fd);font-size:18px}
.forecast-strip small{color:var(--ink-3);font-size:12.5px}
.kv{display:flex;flex-direction:column;padding-inline-start:20px;border-inline-start:1px solid var(--line);min-width:110px}
.kv span{font-size:12px;color:var(--ink-3)}
.kv b{font-family:var(--fd);font-size:19px}

/* ---------- لوحة المؤشرات ---------- */
.kpi{padding:18px 20px}
.kpi span{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi b{font-family:var(--fd);font-size:30px;display:block;line-height:1.25;margin-top:4px}
.kpi small{color:var(--ink-3);font-size:12.5px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:150px 1fr 52px;align-items:center;gap:12px;cursor:pointer;border-radius:10px;padding:4px 6px;margin:-4px -6px}
.bar-row:hover{background:var(--sunk)}
.bar-row .nm{font-weight:600;font-size:14px}
.stack{display:flex;height:12px;border-radius:12px;overflow:hidden;background:var(--sunk);gap:2px}
.stack i{display:block;height:100%}
.stack .f{background:var(--ok)}.stack .p{background:var(--part)}.stack .m{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:start;font-weight:600;color:var(--ink-3);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
.tw{overflow-x:auto}
.activity{display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.activity div{display:flex;gap:10px}
.activity i{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:8px;flex:none}
.activity small{color:var(--ink-3);display:block;font-size:12px}

/* ---------- المكتبة ---------- */
.ind{margin-bottom:18px}
.ind-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.ind-h h3{margin:0;font-family:var(--fd);font-size:18px}
.req{padding:14px 20px;border-bottom:1px solid var(--line-2)}
.req:last-child{border-bottom:0}
.req-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.req-top b{font-size:15px}
.req ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.req li{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sunk);border-radius:10px;font-size:13.5px}
.req li .ty{font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--surface)}
.req li .t{flex:1}

/* ---------- التوقع ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f);fill:var(--ink-3);font-size:11px}
.status-big{font-family:var(--fd);font-size:22px;font-weight:700}

/* ---------- التقرير ---------- */
.report-prev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:34px 40px}
.report-prev h1{font-family:var(--fd);margin:0 0 4px;font-size:26px}
.report-prev h2{font-family:var(--fd);font-size:18px;margin:26px 0 10px}

/* ---------- نوافذ ---------- */
dialog{border:0;border-radius:18px;padding:0;width:min(640px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(8,24,21,.45);backdrop-filter:blur(2px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line-2)}
.dlg-h h3{margin:0;font-family:var(--fd);font-size:18px;flex:1}
.dlg-b{padding:18px 22px;max-height:66vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line-2)}
.pre{white-space:pre-wrap;font-size:13.5px;background:var(--sunk);border-radius:10px;padding:14px;line-height:1.8}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:17px;height:17px;accent-color:var(--brand)}

/* ---------- الجوال ---------- */
.tabbar{display:none}
@media (max-width:1100px){.g-kpi{grid-template-columns:repeat(2,1fr)}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .topbar{padding:0 16px;height:58px}
  .content{padding:18px 14px 110px}
  .g2,.pickers{grid-template-columns:1fr}
  .hero{padding:24px 20px;flex-direction:column;align-items:flex-start;border-radius:18px}
  .hero h1{font-size:28px}
  .tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);text-decoration:none;padding:6px 0;border-radius:10px}
  .tabbar a[aria-current=page]{color:var(--brand);font-weight:700;background:var(--brand-soft)}
  .crumbs{display:none}
  .pill{white-space:nowrap;padding:3px 10px;font-size:12px}
  .bar-row{grid-template-columns:110px 1fr 44px}
  .cond-b{padding-inline-end:2px}
  .plan-inline{grid-template-columns:1fr}
  .kv{padding-inline-start:0;border:0}
  .report-prev{padding:22px 18px}
  .forecast-strip{gap:16px}
  .mobile-brand{display:flex!important}
}
.mobile-brand{display:none;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:18px}
.mobile-brand .logo{width:32px;height:32px;border-radius:9px}
.mobile-brand .logo svg{width:18px;height:18px}
@media (max-width:520px){.g-kpi{grid-template-columns:1fr 1fr;gap:12px}.kpi b{font-size:24px}.kpi{padding:14px}}
@media print{.rail,.topbar,.tabbar,.no-print{display:none!important}.app{display:block}.content{padding:0}.card{box-shadow:none}}
</style>
</head>
